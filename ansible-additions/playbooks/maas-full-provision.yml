---
# =============================================================================
# maas-full-provision.yml – Push-basierte Vollprovisionierung
# Verwendung: ansible-playbook -i inventory/maas/maas_inventory.py playbooks/maas-full-provision.yml
# =============================================================================
- name: "Bauer Group – Vollprovisionierung (Push)"
  hosts: maas_provisioned
  become: true
  gather_facts: true
  serial: "{{ serial_count | default('100%') }}"

  roles:
    - node-identity
    - maas-bootstrap
    - security-baseline
    - monitoring-agent
    # Hier weitere Rollen nach Bedarf
