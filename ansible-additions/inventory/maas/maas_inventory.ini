[maas]
# MAAS API Endpunkt (ohne /api/2.0/)
api_url = http://10.110.0.1:5240/MAAS/api/2.0/

# API Key: Aus /root/.maas/api-key auf dem MAAS Server
# Oder: maas apikey --username admin
# Format: consumer_key:token_key:token_secret
api_key = CHANGE_ME

# SSH User für Ansible (Standard: ubuntu)
ssh_user = ubuntu

# Wie soll Ansible den Host erreichen: ip oder hostname
address_type = ip
