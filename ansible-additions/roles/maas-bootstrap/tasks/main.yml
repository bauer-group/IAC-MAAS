---
# =============================================================================
# Rolle: maas-bootstrap
# Zweck: Basis-Setup nach MAAS Deployment.
#        Pakete, NTP, Timezone, Hostname, MOTD, Sysctl, Ansible-Pull Setup.
# =============================================================================

# ── Basispakete ──────────────────────────────────────────────────────────
- name: "Basispakete installieren"
  ansible.builtin.apt:
    name: "{{ maas_bootstrap_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  retries: 3
  delay: 10

# ── Zeitzone & NTP ────────────────────────────────────────────────────────
- name: "Zeitzone setzen"
  ansible.builtin.timezone:
    name: "{{ bauergroup_timezone }}"

- name: "Chrony Konfiguration"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: restart chrony

- name: "Chrony aktivieren"
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

# ── Hostname ──────────────────────────────────────────────────────────────
- name: "Hostname sicherstellen"
  ansible.builtin.hostname:
    name: "{{ ansible_hostname }}"

- name: "/etc/hosts aktualisieren"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ ansible_fqdn }} {{ ansible_hostname }}"

# ── Verzeichnisse ────────────────────────────────────────────────────────
- name: "Bauer Verzeichnisstruktur"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/bauer-group
    - /var/log/bauer-group
    - /opt/bauer-group
    - /opt/bauer-group/scripts
    - /etc/ansible/facts.d

# ── MOTD ─────────────────────────────────────────────────────────────────
- name: "Bauer MOTD"
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    mode: "0644"

# ── Sysctl Basis-Tuning ─────────────────────────────────────────────────
- name: "Sysctl Basis"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ maas_bootstrap_sysctl | dict2items }}"

# ── Sysctl Overrides (aus group_vars) ────────────────────────────────────
- name: "Sysctl Overrides"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ bauergroup_sysctl_overrides | default({}) | dict2items }}"
  when: bauergroup_sysctl_overrides is defined

# ── Journal Limits ───────────────────────────────────────────────────────
- name: "Journald Konfiguration"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/bauer.conf
    content: |
      [Journal]
      SystemMaxUse=500M
      MaxRetentionSec=30day
    mode: "0644"
  notify: restart journald

# ── Ansible Pull Service sicherstellen ────────────────────────────────────
- name: "Ansible Pull Service prüfen"
  ansible.builtin.systemd:
    name: ansible-pull.timer
    enabled: true
    state: started
  when: bauergroup_maas_managed | default(false)

# ── Provisionierungs-Marker ──────────────────────────────────────────────
- name: "Bootstrap-Marker setzen"
  ansible.builtin.copy:
    dest: /etc/bauer-group/bootstrap-complete
    content: |
      bootstrap_completed: {{ ansible_date_time.iso8601 }}
      ansible_version: {{ ansible_version.full }}
      hostname: {{ ansible_hostname }}
    mode: "0644"
